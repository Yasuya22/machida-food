<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4a36">
<title>オフライン｜MACHIDA FOOD</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #f6f2e8; color: #1e2b24;
         font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; line-height: 1.7; text-align: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 340px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif; font-size: 22px; margin: 16px 0 4px; }
  p { color: #56655b; font-size: 14px; margin: 0; }
  .line { width: 48px; height: 1px; background: #d2ae58; margin: 16px auto; }
  button { margin-top: 20px; border: 0; border-radius: 12px; background: #1f4a36; color: #f6f2e8; font-weight: 700; padding: 12px 24px; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>インターネットに接続されていません</h1>
    <div class="line"></div>
    <p>空席やクーポンは最新の情報を表示するため、接続が必要です。電波の良い場所で、もう一度お試しください。</p>
    <button onclick="location.reload()">再読み込み</button>
  </div>
</body>
</html>
