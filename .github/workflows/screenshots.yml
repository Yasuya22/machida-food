# 画面の確認用スクリーンショット（幅375px）
# preview-shots ブランチに push すると、一時的な Supabase を立ち上げ（架空5店舗・デモデータ）、
# アプリを組み立てて、ログイン→会員登録→店舗・運営の画面まで撮影する。
# 画像は preview-shots-output ブランチに保存する。外部には公開しない。終わると環境は消える。
name: Screenshots

on:
  push:
    branches: [preview-shots]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 一時的なSupabaseを起動（マイグレーションと初期データを適用）
        run: npx --yes supabase@2 start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta

      - name: 接続先を設定
        run: |
          npx --yes supabase@2 status -o env > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "NEXT_PUBLIC_BRAND=food"
          } > .env.local
          sed 's/=.*/=(設定済み)/' .env.local

      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: 撮影
        run: |
          npx --yes playwright@1.52.0 install --with-deps chromium
          npm install --no-save playwright@1.52.0
          (npx next start -H 127.0.0.1 -p 3000 > /tmp/next.log 2>&1 &)
          npx --yes wait-on@8.0.3 http://127.0.0.1:3000
          node scripts/screenshots.mjs shots || (tail -50 /tmp/next.log; exit 1)

      - name: 画像を保存
        if: always()
        run: |
          mkdir -p shots && cp /tmp/next.log shots/next.log 2>/dev/null || true
          cd shots
          git init -q -b preview-shots-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "screenshots ${GITHUB_SHA}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-shots-output
